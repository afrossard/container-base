# no-mistakes gate configuration for the managed project.
# Applied by the provision-firstmate recipe; model policy in tooling/README.md.

# Merge authority: crew ship-tasks reach origin only through the gate.
mode: no-mistakes

# The pipeline agent the gate runs its review, test, docs and lint
# passes through. Pinned explicitly so the gate never opens an
# interactive model picker in an unattended run.
agent:
  harness: claude
  model: sonnet

# Ordered fallback when the primary gate-agent reports no quota; kept
# pinned so the fallback path cannot reach a barred tier either.
fallback:
  - harness: claude
    model: sonnet

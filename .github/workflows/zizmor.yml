# Required check (homebrew-tap ADR 0001), so no `paths` filter: a required
# check that a path filter skips stays pending forever and blocks the merge.
#
# The zizmor version is pinned and bumped by Renovate (renovate.json), so a
# new zizmor audit lands as a reviewable PR instead of reddening every open PR.
name: zizmor

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security off: findings fail this job instead of only
      # landing in the Security tab, which is what makes the check gate merges.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          min-severity: high
          advanced-security: false
          annotations: true

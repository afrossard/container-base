name: launcher

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run test:launcher

      # Both suites cover the host-side scripts. Renaming this workflow to
      # match is left for a separate commit, so this one doesn't move a
      # required check.
      - run: npm run test:cleanup

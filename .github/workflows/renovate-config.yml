name: renovate-config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/renovate-global.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker://ghcr.io/renovatebot/renovate:44.264.1@sha256:35777dd4aa87beee05ba64c7728a2c5e3c70687fdb654909710bac93c697efd1
        with:
          args: renovate-config-validator --strict
        env:
          RENOVATE_CONFIG_FILE: .github/renovate-global.json

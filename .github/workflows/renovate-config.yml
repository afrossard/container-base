name: renovate-config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/renovate-global.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker://ghcr.io/renovatebot/renovate:45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb
        with:
          args: renovate-config-validator --strict
        env:
          RENOVATE_CONFIG_FILE: .github/renovate-global.json

name: renovate-config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/renovate-global.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker://ghcr.io/renovatebot/renovate:44.235.3@sha256:5ab865a8d9a730b07d41fb434110c3e97243dc8c21efb029c60f748d0523d292
        with:
          args: renovate-config-validator --strict
        env:
          RENOVATE_CONFIG_FILE: .github/renovate-global.json

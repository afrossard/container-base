name: renovate-config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/renovate-global.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker://ghcr.io/renovatebot/renovate:44.257.5@sha256:d57dca79611ee02af29f1243d27956618a291e6364294ea8ae17629b2e66696f
        with:
          args: renovate-config-validator --strict
        env:
          RENOVATE_CONFIG_FILE: .github/renovate-global.json

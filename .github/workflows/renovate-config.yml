name: renovate-config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/renovate-global.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker://ghcr.io/renovatebot/renovate:44.241.0@sha256:7397a1b4893806ca4f25b175236932e2496bca52e9230668ac79ea0ef3868e5f
        with:
          args: renovate-config-validator --strict
        env:
          RENOVATE_CONFIG_FILE: .github/renovate-global.json

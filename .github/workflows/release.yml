name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    # Write access only where release-please needs it, to tag, release, and
    # maintain the release PR; the publish jobs set their own.
    permissions:
      contents: write
      pull-requests: write
    # Queued, never cancelled: a cancelled run could strand a release it was
    # cutting. A run that read a stale tree is always followed by a run at
    # least as new as the push that outdated it, and always-update makes that
    # run rewrite the release PR
    # (https://github.com/googleapis/release-please/issues/2890).
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # continue-on-error + the guard below work around
      # https://github.com/googleapis/release-please-action/issues/1203:
      # a transient failure while drafting the next release PR (pass 2) must not
      # strand a release that pass 1 already cut, whose outputs are already set.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: fail if release-please failed without cutting a release
        if: steps.release.outcome == 'failure' && steps.release.outputs.release_created != 'true'
        run: exit 1

  publish-dev:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/afrossard/container-base:${{ needs.release-please.outputs.version }}-dev
    steps:
      # The release commit, not github.sha: the queue can replace the run for
      # the release merge with a newer push's run, which then cuts the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: ./.github/actions/setup

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run publish:dev

      - run: npm run verify:publish-dev

  publish-agent:
    needs: [release-please, publish-dev]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/afrossard/container-base:${{ needs.release-please.outputs.version }}-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: ./.github/actions/setup

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run publish:agent

      - run: npm run verify:publish-agent

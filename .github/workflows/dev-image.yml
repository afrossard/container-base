name: dev image

on:
  pull_request:
    paths:
      - images/dev/**
      - test/dev/**
      - package.json
      - package-lock.json
      - .github/workflows/dev-image.yml
      - .github/actions/setup/**
  workflow_dispatch:

jobs:
  dev-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npm run build:dev

      - run: npm run test:dev

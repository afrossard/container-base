name: dev image

on:
  pull_request:
    paths:
      - images/dev/**
      - test/dev/**
      - package.json
      - package-lock.json
      - .github/workflows/dev-image.yml
  workflow_dispatch:

jobs:
  dev-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build:dev

      - run: npm run test:dev

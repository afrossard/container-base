# Self-hosted because the Mend app's allowedCommands cannot run the
# devcontainer lock generator (ADR-0027).
#
# Renovate authenticates as a GitHub App installation token, not
# GITHUB_TOKEN, because pushes made with GITHUB_TOKEN do not trigger CI on
# the PRs Renovate opens. CONTRIBUTING.md lists the App's setup.
name: renovate

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint a GitHub App token for Renovate
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ steps.app-token.outputs.token }}

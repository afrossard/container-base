name: setup
description: Node toolchain plus npm dependencies, shared by the CI jobs.

# Callers run actions/checkout first: a local action is read from the checked-out tree, so it cannot contain the checkout step itself.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        cache: npm

    - run: npm ci
      shell: bash
